services:
  api:
    build: .
    environment:
      PORT: "3000"
      REDIS_HOST: redis
    expose:
      - "3000"
    networks:
      - backend-net
    depends_on:
      - redis
 
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"          # puerta de entrada pública
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api                  # compose arranca la API antes que Nginx
    networks:
      - backend-net
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge
