events {}
 
http {
  server {
    listen 8080;
 
    # Encabezados de Nginx datos originales para reenviar a la API
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
 
    # GET /health  ->  http://api:3000/health
    location = /health {
      proxy_pass http://api:3000/health;
    }
 
    # GET /api/... para todo lo que empiece asi  ->  http://api:3000/api/...
    location /api/ {
      proxy_pass http://api:3000;
    }
 
    # Otra ruta  ->  http://api:3000/...
    location / {
      proxy_pass http://api:3000;
    }
  }
}
